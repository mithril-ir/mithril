name: Agda

# Type-checks everything under agda/ only: the five embedded fixed-schema
# Agda kernel modules that `mithril verify` trusts, plus the experiments
# outside that kernel — the Mithril.Spike example and one hand-transcribed
# application slice, a NoSelfPrivilegeEscalation proof for the Acme
# Membership.changeRole action (see agda/README.md). It verifies neither
# the JSON document under examples/ nor the TenantIsolation and
# AuthenticatedMutation target properties.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Type-check Agda spike
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: source

      - name: Install Agda 2.8.0
        uses: agda/agda-setup-action@c931d59d76a036d1bed9f322cc12cc105bda7881 # v1
        with:
          agda-version: "2.8.0"

      - name: Print Agda version
        run: agda --version

      - name: Check spike (safe)
        working-directory: source
        run: |
          find . -type f -name '*.agdai' -delete
          agda --safe -i agda agda/Mithril/Everything.agda

      - name: Check spike (safe, no libraries, ignore interfaces)
        working-directory: source
        run: |
          find . -type f -name '*.agdai' -delete
          agda --safe --no-libraries --ignore-interfaces -i agda agda/Mithril/Everything.agda
