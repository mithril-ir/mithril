name: Haskell

# Builds and tests the Haskell host tool: the mithril-ir Cabal package
# with the mithril CLI (help, version, and 'mithril validate FILE':
# JSON parsing, structural Core v0 validation against the schema
# compiled in from core/schema.json, and complete name resolution),
# its unit and process-level tests, and the downstream API-boundary
# compile-fail probes. The validate command establishes JSON shape
# conformance and name resolution only; no typechecker, normalizer,
# verifier, or generator exists yet.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up GHC and cabal-install
        uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553 # v2.11.0
        with:
          ghc-version: "9.12.4"
          cabal-version: "3.18.1.0"
          cabal-update: true

      - name: Check package description
        run: cabal check

      - name: Build
        run: cabal build all --enable-tests

      - name: Test
        run: cabal test all --test-show-details=direct

      - name: API-boundary compile-fail probes
        run: sh test/api-probes/run-api-probes.sh

      - name: Validate Acme Core document
        run: cabal run mithril -- validate examples/acme/acme.mir.json

      - name: Run mithril --help
        run: cabal run mithril -- --help

      - name: Run mithril --version
        run: cabal run mithril -- --version

      - name: Create source distribution
        run: cabal sdist all
