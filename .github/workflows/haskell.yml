name: Haskell

# Builds and tests the Haskell host tool: the mithril-ir Cabal package
# with the mithril CLI (help, version, 'mithril validate FILE': JSON
# parsing, structural Core v0 validation against the schema compiled
# in from core/schema.json, complete name resolution, complete static
# typing, and deterministic normalization into the internal typed
# normalized Core, 'mithril contract FILE': the same pipeline
# followed by deterministic rendering of the normalized document as
# the human-readable security contract, and 'mithril verify FILE':
# the same pipeline followed by the first connected verifier slice —
# a deterministic support gate and, for exactly one supported
# NoSelfPrivilegeEscalation obligation family (non-empty case
# collections of the change-other and bounded self-update rules),
# generated Agda checked by exactly Agda 2.8.0 in safe mode), its unit and
# process-level tests, and the downstream API-boundary compile-fail
# probes. The validate command establishes JSON shape conformance,
# name resolution, static well-typedness, and deterministic
# structural normalization only — no policy evaluation, no
# simplification or optimization, and no canonical equality across
# differently authored documents — the contract command only restates
# the normalized document for review: it is not a semantic diff, and
# its rendered guarantees remain unverified proof obligations; and
# the verify command implements exactly the one obligation slice: the
# canonical Acme document stays unsupported (its TenantIsolation and
# AuthenticatedMutation obligations remain unverified), the dangerous
# self-promotion mutation stays unsupported rather than a violation
# verdict, and a checker problem is a tool failure, never a semantic
# verdict; and 'mithril wasp check CORE_FILE WASP_ROOT' regenerates the
# closed Wasp Confinement Profile v0 of the singleton rule-1 slice and
# the Wasp Confinement Profile v1 of the ordered rule-1, rule-2 pair
# (VERIFIED required; every other verified plan is refused by the
# profile dispatcher) and pins the committed fixtures
# test/fixtures/wasp-acme and test/fixtures/wasp-acme-self-update
# byte-for-byte without touching Wasp, Node, or PostgreSQL (the real
# Wasp 0.25.0 / PostgreSQL vertical test runs in its own workflow,
# wasp.yml). Agda 2.8.0 is
# installed here because the verifier's end-to-end checks (in the
# test suite, the explicit verify steps below, and the wasp check
# step's verifier gate) invoke the real
# checker; the standalone Agda spike keeps its own workflow.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: source
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source

      - name: Set up GHC and cabal-install
        uses: haskell-actions/setup@cd0d9bdd65b20557f41bea4dbe43d0b5fbbfe553 # v2.11.0
        with:
          ghc-version: "9.12.4"
          cabal-version: "3.18.1.0"
          cabal-update: true

      # The verifier invokes exactly Agda 2.8.0 across a process
      # boundary; the same pinned setup action as the Agda spike
      # workflow provides it.
      - name: Install Agda 2.8.0
        uses: agda/agda-setup-action@c931d59d76a036d1bed9f322cc12cc105bda7881 # v1
        with:
          agda-version: "2.8.0"

      - name: Print Agda version
        run: agda --version

      - name: Check package description
        run: cabal check

      - name: Build
        run: cabal build all --enable-tests

      - name: Test
        run: cabal test all --test-show-details=direct

      - name: API-boundary compile-fail probes
        run: sh test/api-probes/run-api-probes.sh

      # The driver's build isolation: from a clean copy of the sources,
      # two concurrent driver runs must both succeed with disjoint build
      # roots and leave no default dist-newstyle behind.
      - name: Probe-driver build isolation (clean copy, two concurrent runs)
        run: sh test/api-probes/test-run-api-probes.sh

      - name: Validate Acme Core document
        run: cabal run mithril -- validate examples/acme/acme.mir.json

      - name: Render Acme security contract
        run: cabal run mithril -- contract examples/acme/acme.mir.json

      # The end-to-end generated-verifier checks: the supported
      # singleton rule-1 fixture and the supported two-case rule-1/rule-2
      # fixture must verify under the real Agda 2.8.0 safe check
      # (exit 0); the dangerous self-promotion mutation and the
      # canonical Acme document must remain unsupported with exactly
      # exit 3 — the former is a genuine counterexample the verifier
      # deliberately does not turn into a verdict, and the latter's
      # TenantIsolation and AuthenticatedMutation obligations are not
      # implemented; unsupported is never a verdict.
      - name: Verify the supported NoSelfPrivilegeEscalation fixture
        run: cabal run mithril -- verify test/fixtures/acme-nspe.mir.json

      - name: Verify the supported two-case self-update fixture
        run: cabal run mithril -- verify test/fixtures/acme-nspe-self-update.mir.json

      - name: Dangerous self-promotion mutation is unsupported (exit 3)
        run: |
          set +e
          cabal run mithril -- verify test/fixtures/acme-nspe-dangerous.mir.json
          status=$?
          set -e
          if [ "$status" -ne 3 ]; then
            echo "expected exit 3, got $status" >&2
            exit 1
          fi

      - name: Canonical Acme document is unsupported (exit 3)
        run: |
          set +e
          cabal run mithril -- verify examples/acme/acme.mir.json
          status=$?
          set -e
          if [ "$status" -ne 3 ]; then
            echo "expected exit 3, got $status" >&2
            exit 1
          fi

      # The Wasp Confinement Profiles of the supported slices (VERIFIED
      # required by the command): each committed generated fixture must
      # be exactly the fresh bundle of its document (exit 0) — Profile
      # v0 for the singleton rule-1 fixture, Profile v1 for the two-case
      # rule-1/rule-2 fixture; the commands need no Wasp, Node, or
      # PostgreSQL installation.
      - name: Check the committed Wasp Profile-v0 fixture against a fresh bundle
        run: cabal run mithril -- wasp check test/fixtures/acme-nspe.mir.json test/fixtures/wasp-acme

      - name: Check the committed Wasp Profile-v1 fixture against a fresh bundle
        run: cabal run mithril -- wasp check test/fixtures/acme-nspe-self-update.mir.json test/fixtures/wasp-acme-self-update

      - name: Run mithril --help
        run: cabal run mithril -- --help

      - name: Run mithril --version
        run: cabal run mithril -- --version

      - name: Create source distribution
        run: cabal sdist all
